name: CI (Nuxt)

# Runs on every push/PR touching the frontend — confirms it builds — but never deploys.
# See deploy-frontend.yml for the manual, on-demand deploy.
on:
  push:
    branches: [main]
    paths:
      - 'frontend/**'
  pull_request:
    paths:
      - 'frontend/**'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Generate static build
        working-directory: frontend
        run: npm run generate
        env:
          # Any URL works for a build check; the real one is set in deploy-frontend.yml.
          NUXT_PUBLIC_API_BASE_URL: https://api.example.com
