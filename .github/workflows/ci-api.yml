name: CI (Laravel)

# Runs on every push/PR that touches the API so you always know if main is green — never deploys.
# See deploy-api.yml for the manual, on-demand deploy.
on:
  push:
    branches: [main]
    paths-ignore:
      - 'frontend/**'
      - '.github/workflows/deploy-frontend.yml'
      - '.github/workflows/ci-frontend.yml'
  pull_request:
    paths-ignore:
      - 'frontend/**'

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: true
          MYSQL_DATABASE: project_tracker_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_DATABASE: project_tracker_test
      DB_USERNAME: root
      DB_PASSWORD: ''

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, pdo_mysql, mysqli, bcmath, intl, gd, zip
          coverage: none

      - name: Install PHP dependencies
        run: composer install --prefer-dist --no-progress

      - name: Configure environment
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Run test suite
        run: php artisan test
